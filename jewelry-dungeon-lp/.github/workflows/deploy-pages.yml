name: Deploy LP to GitHub Pages

# main に push すると LP をビルドして GitHub Pages に公開します。
# 初回のみ（必須）: リポジトリ Settings > Pages > Build and deployment > Source を「GitHub Actions」にしてください。
# このファイルは、jewelry-dungeon-lp の中身をリポジトリのルートに置いた構成を前提にしています。

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 元データ用のテンプレートリポジトリ（maco23plas 配下）では公開しない。
    # 「Use this template」やフォークで作った公開用リポジトリでのみ実行する。
    if: ${{ !github.event.repository.is_template && github.repository_owner != 'maco23plas' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path
        # <account>.github.io リポジトリ、またはカスタムドメイン（変数 PAGES_ROOT=true）ならルート配信。
        # それ以外（https://<account>.github.io/<repo>/）はリポジトリ名をサブパスにする。
        env:
          PAGES_ROOT: ${{ vars.PAGES_ROOT }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$PAGES_ROOT" == "true" || "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi
          echo "base path: '${NEXT_PUBLIC_BASE_PATH:-/$REPO}'"

      - name: Build (static export)
        run: npm run build

      - name: Setup Pages
        # 事前に Settings > Pages > Source を「GitHub Actions」にしておくこと（自動有効化は権限不足で失敗するため行わない）
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
