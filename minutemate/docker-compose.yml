services:
  minutemate:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      BROWSER_NO_SANDBOX: '1'
    # Chromium が使う共有メモリ。小さいとタブがクラッシュするので広げる
    shm_size: '1gb'
    volumes:
      - ./data:/app/data
      - ./businesses.yaml:/app/businesses.yaml:ro
    ports:
      - '8788:8788' # Web ダッシュボード
