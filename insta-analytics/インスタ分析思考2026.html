  .grid { display:grid; gap:12px; }
  .stack { display:flex; flex-direction:column; gap:16px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 18px;

    background:var(--primary); color:var(--primary-ink); transition:filter .15s, transform .05s; white-space:nowrap; }
  .btn:hover { filter:brightness(1.05); } .btn:active { transform:scale(.98); }
  .btn svg { width:16px; height:16px; }

  .btn.bad { background:var(--bad); color:#fff; }

  .pill.update { background:var(--update-bg); color:var(--update); }
  .pill.new { background:var(--new-bg); color:var(--new); }
  .pill.ok { background:var(--ok-bg); color:var(--ok); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .pill.line { background:transparent; border:1px solid var(--border); color:var(--muted-ink); }
  .pill.api { background:var(--accent-bg); color:var(--primary); }

  .dot { width:8px; height:8px; border-radius:999px; display:inline-block; }
  .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.bad{background:var(--bad);}
  .dot.none{background:color-mix(in srgb,var(--muted-ink) 45%,transparent);}

  label.fld { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:500; }
  .fld .hint { font-weight:400; font-size:11px; color:var(--muted-ink); }
  input, select, textarea { font-family:inherit; font-size:15px; color:var(--ink); background:var(--card);

  input:focus, select:focus, textarea:focus { border-color:var(--primary);

  textarea { min-height:76px; resize:vertical; font-variant-numeric:normal; }

  .fsec { border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--card-2); }
  .fsec > .fsec-t { font-size:12px; font-weight:700; color:var(--muted-ink); letter-spacing:.04em; margin-bottom:10px; }

  .sticky-save { position:sticky; bottom:76px; z-index:10; display:flex; gap:8px; justify-content:flex-end;
    padding:12px; margin:0 -4px; background:color-mix(in srgb,var(--bg) 80%,transparent); backdrop-filter:blur(8px); border-radius:14px; }
  @media (min-width:860px){ .sticky-save { bottom:12px; } }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  .twrap { overflow-x:auto; }
  th { text-align:left; font-size:12px; font-weight:600; color:var(--muted-ink); padding:12px; white-space:nowrap; border-bottom:1px solid var(--border); }
  td { padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:color-mix(in srgb,var(--muted) 55%,transparent); }
  th.r, td.r { text-align:right; }
  .sortbtn { background:none; border:none; color:inherit; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; padding:0; }

  .empty { display:flex; flex-direction:column; align-items:center; text-align:center; padding:56px 24px;

  .empty .eicon { width:56px; height:56px; border-radius:16px; background:var(--muted); color:var(--muted-ink);
    display:grid; place-items:center; margin-bottom:16px; }
  .empty h3 { font-size:17px; font-weight:600; }
  .empty p { color:var(--muted-ink); font-size:13px; max-width:440px; margin:6px 0 0; }

  .tabs { display:inline-flex; background:var(--muted); padding:4px; border-radius:12px; gap:2px; }
  .tabs button { border:none; background:transparent; padding:7px 14px; border-radius:9px; font-size:14px;
    font-weight:500; color:var(--muted-ink); cursor:pointer; }
  .tabs button.active { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .kpi { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
  .kpi .lab { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted-ink); }
  .kpi .val { font-size:24px; font-weight:700; margin-top:6px; }
  .kpi .bm { font-size:11px; color:var(--muted-ink); margin-top:3px; }
  .delta { display:inline-flex; align-items:center; gap:3px; font-size:12px; }
  .delta.up{color:var(--ok);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted-ink);}

  .cta-hero h3 { font-size:16px; font-weight:700; }
  .cta-hero p { font-size:13px; color:var(--muted-ink); margin-top:4px; }

  .step-badge { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:999px;

  .chip.on { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }

  .preview { background:color-mix(in srgb,var(--muted) 60%,var(--card)); border-radius:12px; padding:14px; }

  .wizard { max-width:560px; margin:24px auto 0; }
  .wizard .big-choice { display:flex; align-items:center; gap:14px; width:100%; text-align:left;

  svg.chart text { fill:var(--muted-ink); font-size:11px; }
  .spark-wrap { border:1px solid var(--border); border-radius:12px; padding:14px; }

  .muted { color:var(--muted-ink); } .fs12{font-size:12px;} .fs13{font-size:13px;}
  .flex{display:flex;} .between{justify-content:space-between;} .items-center{align-items:center;}
  .gap8{gap:8px;} .gap12{gap:12px;} .wrapf{flex-wrap:wrap;} .mt{margin-top:14px;} .mb{margin-bottom:14px;}

  .toast { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:10px 16px; border-radius:999px; font-size:14px; z-index:60; box-shadow:var(--shadow);

  :focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

/* ============================ 計算・フォーマット ============================ */
function ratio(n,d){ if(n==null||d==null) return null; if(d===0) return null; if(!isFinite(n)||!isFinite(d)) return null; return n/d; }
function sub(a,b){ if(a==null||b==null) return null; return a-b; }
function weeklyRates(e){
  return {
    followerGrowth: ratio(e.newFollowers, e.followersStart),
    homeRate: ratio(e.followerReach, e.followersStart),
    nonFollowerReachRate: ratio(sub(e.reach,e.followerReach), e.reach),
    profileVisitRate: ratio(e.profileVisits, e.reach),
    followerConversionRate: ratio(e.newFollowers, e.profileVisits),
    saveRate: ratio(e.saves, e.reach),
    shareRate: ratio(e.shares, e.reach),
    linkCtr: ratio(e.linkClicks, e.profileVisits),
    storyViewRate: ratio(e.storyViews, e.followersStart),
    conversionRate: ratio(e.conversions, e.linkClicks)
  };
}
function postRates(p){
  return {
    retentionRate: ratio(p.avgWatchSec, p.videoSec),
    likeRate: ratio(p.likes, p.views),
    saveRate: ratio(p.saves, p.views),
    shareRate: ratio(p.shares, p.views),
    profileVisitRate: ratio(p.profileVisits, p.views)
  };
}
function suggestVerdict(r,t){
  if((r.saveRate!=null && r.saveRate>=t.winSaveRate)||(r.shareRate!=null && r.shareRate>=t.winShareRate)) return "勝ち候補";
  if(r.saveRate!=null && r.shareRate!=null && r.likeRate!=null){
    if(r.saveRate<t.loseSaveRate && r.shareRate<t.loseShareRate && r.likeRate<t.loseLikeRate) return "負け候補";
  }
  return null;
}
function rateStatus(v,good,warn){ if(v==null) return "none"; if(v>=good) return "good"; if(v>=warn) return "warn"; return "bad"; }
function pct(v,d){ if(v==null||!isFinite(v)) return "—"; return (v*100).toFixed(d===undefined?1:d)+"%"; }
function intf(v){ if(v==null||!isFinite(v)) return "—"; return Math.round(v).toLocaleString("ja-JP"); }
function shortDate(iso){ if(!iso) return "—"; var p=String(iso).split("-"); if(p.length<3) return iso; return (+p[1])+"/"+(+p[2].slice(0,2)); }
function delta(c,p){ if(c==null||p==null) return null; return c-p; }
function deltaHtml(d){
  if(d==null||!isFinite(d)) return '<span class="delta flat tnum">—</span>';
  var pts=d*100, abs=Math.abs(pts).toFixed(1);
  if(Math.abs(pts)<0.05) return '<span class="delta flat tnum">±0.0 pt</span>';
  if(pts>0) return '<span class="delta up">'+IC.tup+'<span class="tnum">'+abs+' pt</span></span>';
  return '<span class="delta down">'+IC.tdown+'<span class="tnum">'+abs+' pt</span></span>';
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function ymd(d){ var m=("0"+(d.getMonth()+1)).slice(-2), dd=("0"+d.getDate()).slice(-2); return d.getFullYear()+"-"+m+"-"+dd; }
function todayYmd(){ return ymd(new Date()); }

/* ============================ チャート ============================ */
function sparkline(points,color){
  var nn=points.map(function(p){return p.value;}).filter(function(v){return v!=null;});
  if(!nn.length) return '<svg class="chart" width="100%" height="44"></svg>';
  var min=Math.min.apply(null,nn), max=Math.max.apply(null,nn);
  var W=100,H=44,pad=4; if(max===min)max=min+1;
  var n=points.length, pts=[];
  points.forEach(function(p,i){
    if(p.value==null) return;
    var x=n<=1?W/2:pad+(W-2*pad)*i/(n-1), y=H-pad-(H-2*pad)*(p.value-min)/(max-min);
    pts.push(x.toFixed(1)+","+y.toFixed(1));
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" width="100%" height="44"><polyline fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="'+pts.join(" ")+'"/></svg>';
}
function lineChart(points,benchmark,benchLabel,color){
  color=color||"var(--c1)";
  var vals=points.map(function(p){return p.value;}).filter(function(v){return v!=null;});
  if(benchmark!=null) vals.push(benchmark);
  if(!vals.length) return '<p class="muted fs13" style="text-align:center;padding:32px 0">データが不足しています。</p>';
  var top=Math.max.apply(null,vals)*1.25||0.01; if(top<=0)top=0.01;
  var W=560,H=240,L=44,R=16,T=12,B=28, iw=W-L-R, ih=H-T-B, n=points.length;
  function X(i){ return n<=1?L+iw/2:L+iw*i/(n-1); }
  function Y(v){ return T+ih*(1-v/top); }
  var grid=""; for(var g=0;g<=4;g++){ var v=top*g/4,y=Y(v);
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-dasharray="3 3"/>';
    grid+='<text x="'+(L-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(v*100)+'%</text>'; }
  var xlab=""; points.forEach(function(p,i){ xlab+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>'; });
  var line="",dots="",prev=null;
  points.forEach(function(p,i){
    if(p.value==null){prev=null;return;}
    var x=X(i),y=Y(p.value);
    if(prev) line+='<line x1="'+prev.x.toFixed(1)+'" y1="'+prev.y.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>';
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="'+color+'"><title>'+esc(p.label)+'：'+pct(p.value)+'</title></circle>';
    prev={x:x,y:y};
  });
  var bench="";
  if(benchmark!=null){ var by=Y(benchmark);
    bench='<line x1="'+L+'" y1="'+by.toFixed(1)+'" x2="'+(W-R)+'" y2="'+by.toFixed(1)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>'+
      '<text x="'+(W-R)+'" y="'+(by-4).toFixed(1)+'" text-anchor="end" style="fill:var(--warn)">'+esc(benchLabel||"目安")+'</text>'; }
  return '<div class="twrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:480px;height:auto">'+grid+xlab+bench+line+dots+'</svg></div>';
}

/* ============================ Graph API クライアント ============================ */
var GRAPH = "https://graph.facebook.com/v23.0";
function apiCfg(){ return load(K.api, {token:"",savedAt:null}); }
function saveApiCfg(c){ save(K.api, c); }

function gfetch(pathOrUrl){
  var url = pathOrUrl.indexOf("http")===0 ? pathOrUrl : GRAPH + pathOrUrl +
    (pathOrUrl.indexOf("?")>=0 ? "&" : "?") + "access_token=" + encodeURIComponent(apiCfg().token);
  return fetch(url).then(function(r){ return r.json(); }).catch(function(e){ return {error:{message:String(e)}}; });
}
function gAll(path){ // ページネーションを全部たどる
  var out=[];
  function step(url){
    return gfetch(url).then(function(res){
      if(!res || res.error) return Promise.reject(res && res.error ? res.error.message : "通信エラー");
      out = out.concat(res.data||[]);
      if(res.paging && res.paging.next) return step(res.paging.next);
      return out;
    });
  }
  return step(path);
}
function friendlyApiError(msg){
  msg = String(msg||"");
  if(/expired|invalid|session/i.test(msg)) return "トークンが無効か期限切れのようです。設定 > Instagram連携 でトークンを更新してください。";
  if(/permission|scope/i.test(msg)) return "権限が不足しています。トークンに instagram_manage_insights 等の権限が付いているか確認してください。";
  return "取得に失敗しました：" + msg.slice(0,200);
}

/** アカウント週次インサイト（取れない指標は黙ってスキップ） */
function fetchAccountWeek(igId, sinceSec, untilSec){
  var metrics=["views","reach","total_interactions","saves","shares","profile_links_taps"];
  var url="/"+igId+"/insights?metric="+metrics.join(",")+"&period=day&metric_type=total_value&since="+sinceSec+"&until="+untilSec;
  return gfetch(url).then(function(res){
    if(res && !res.error){
      var out={}; (res.data||[]).forEach(function(d){ out[d.name]=(d.total_value&&d.total_value.value!==undefined)?d.total_value.value:null; });
      return out;
    }
    // まとめて失敗 → 1個ずつ
    var out2={};
    var chain=Promise.resolve();
    metrics.forEach(function(m){
      chain=chain.then(function(){
        return gfetch("/"+igId+"/insights?metric="+m+"&period=day&metric_type=total_value&since="+sinceSec+"&until="+untilSec)
          .then(function(r2){ if(r2&&!r2.error&&r2.data&&r2.data.length){ var d=r2.data[0]; out2[m]=(d.total_value&&d.total_value.value!==undefined)?d.total_value.value:null; } });
      });
    });
    return chain.then(function(){ return out2; });
  });
}
/** 日次時系列の合計（フォロワー純増など） */
function sumSeries(igId, metric, sinceSec, untilSec){
  return gfetch("/"+igId+"/insights?metric="+metric+"&period=day&since="+sinceSec+"&until="+untilSec)
    .then(function(res){
      if(!res||res.error||!res.data||!res.data.length) return null;
      var sum=0; (res.data[0].values||[]).forEach(function(v){ sum+=(v.value||0); });
      return sum;
    });
}
/** メディア一覧（期間内） */
function fetchMedia(igId, sinceSec, untilSec){
  return gAll("/"+igId+"/media?fields=id,caption,media_type,media_product_type,timestamp,permalink,like_count,comments_count&since="+sinceSec+"&until="+untilSec+"&limit=50");
}
/** メディア単位インサイト */
function fetchMediaInsights(mediaId, isReel){
  var metrics = isReel
    ? ["views","reach","saved","shares","profile_visits","follows","ig_reels_avg_watch_time"]
    : ["views","reach","saved","shares","profile_visits","follows"];
  return gfetch("/"+mediaId+"/insights?metric="+metrics.join(",")).then(function(res){
    var out={};
    if(res && !res.error){
      (res.data||[]).forEach(function(d){
        var v=null;
        if(d.values&&d.values.length) v=d.values[0].value;
        if(d.total_value&&d.total_value.value!==undefined) v=d.total_value.value;
        out[d.name]=v;
      });
      return out;
    }
    // 個別リトライ（タイプ非対応の指標をスキップ）
    var chain=Promise.resolve();
    metrics.forEach(function(m){
      chain=chain.then(function(){
        return gfetch("/"+mediaId+"/insights?metric="+m).then(function(r2){
          if(r2&&!r2.error&&r2.data&&r2.data.length){
            var d=r2.data[0], v=null;
            if(d.values&&d.values.length) v=d.values[0].value;
            if(d.total_value&&d.total_value.value!==undefined) v=d.total_value.value;
            out[m]=v;
          }
        });
      });
    });
    return chain.then(function(){ return out; });
  });
}

/* ============================ 週レンジ ============================ */
function weekRange(offset){ // offset=1: 先週, 2: 2週前, 0: 今週(途中)
  var now=new Date(), day=(now.getDay()+6)%7; // 月=0
  var mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day-7*offset);
  var end=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+7);
  return { since:mon, untilEx:end, label: ymd(mon)+" 〜 "+ymd(new Date(end.getTime()-86400000)) };
}

/* ============================ 取り込み本体 ============================ */
function importWeek(acc, offset, onStep){
  var r=weekRange(offset);
  var sinceSec=Math.floor(r.since.getTime()/1000), untilSec=Math.floor(r.untilEx.getTime()/1000);
  var result={ weekStart: ymd(r.since), filled:[], missing:[], posts:0 };

  onStep("アカウント指標を取得中…", 10);
  return fetchAccountWeek(acc.igId, sinceSec, untilSec).then(function(totals){
    onStep("フォロワー推移を取得中…", 30);
    return sumSeries(acc.igId,"follower_count",sinceSec,untilSec).then(function(newFollowers){
      return gfetch("/"+acc.igId+"?fields=followers_count").then(function(prof){
        onStep("投稿一覧を取得中…", 45);
        return fetchMedia(acc.igId,sinceSec,untilSec).then(function(medias){
          // 投稿インサイトを順に取得
          var posts=getPosts();
          var chain=Promise.resolve();
          var weekSaves=0, weekShares=0, hasMediaAgg=medias.length>0;
          medias.forEach(function(m,idx){
            chain=chain.then(function(){
              onStep("投稿を取り込み中… "+(idx+1)+"/"+medias.length, 45+Math.round(45*(idx+1)/Math.max(1,medias.length)));
              var isReel=m.media_product_type==="REELS";
              return fetchMediaInsights(m.id,isReel).then(function(ins){
                weekSaves += (ins.saved||0); weekShares += (ins.shares||0);
                var fmt = isReel?"リール":(m.media_type==="CAROUSEL_ALBUM"?"カルーセル":"フィード単枚");
                var entry={
                  igMediaId:m.id,
                  date:(m.timestamp||"").slice(0,10)||result.weekStart,
                  format:fmt,
                  title:((m.caption||"").split("\n")[0]||"（キャプションなし）").slice(0,40),
                  hook:"",
                  views:ins.views!=null?ins.views:null,
                  reach:ins.reach!=null?ins.reach:null,
                  nonFollowerReachPct:null,
                  videoSec:null,
                  avgWatchSec:(isReel&&ins.ig_reels_avg_watch_time!=null)?Math.round(ins.ig_reels_avg_watch_time)/1000:null,
                  likes:m.like_count!=null?m.like_count:null,
                  comments:m.comments_count!=null?m.comments_count:null,
                  saves:ins.saved!=null?ins.saved:null,
                  shares:ins.shares!=null?ins.shares:null,
                  profileVisits:ins.profile_visits!=null?ins.profile_visits:null,
                  follows:ins.follows!=null?ins.follows:null,
                  memo:"", verdict:"普通",
                  permalink:m.permalink||""
                };
                var i=posts.findIndex(function(x){return x.igMediaId===m.id;});
                if(i>=0){ // 再取り込み：数値だけ更新、判定・メモ・手入力は残す
                  ["views","reach","likes","comments","saves","shares","profileVisits","follows","avgWatchSec"].forEach(function(kk){
                    if(entry[kk]!=null) posts[i][kk]=entry[kk];
                  });
                  posts[i].updatedAt=nowISO();
                } else {
                  entry.id=uid(); entry.createdAt=nowISO(); entry.updatedAt=nowISO();
                  posts.push(entry);
                }
                result.posts++;
              });
            });
          });
          return chain.then(function(){
            setPosts(posts);
            onStep("週次データを保存中…", 95);
            // 週次エントリを組み立て（取れない項目は null のまま＝手入力欄）
            var followersNow=(prof&&!prof.error&&prof.followers_count!=null)?prof.followers_count:acc.followers||null;
            var e={
              weekStart:result.weekStart,
              followersStart: followersNow!=null&&newFollowers!=null ? followersNow-newFollowers : followersNow,
              newFollowers:newFollowers,
              posts:medias.length,
              stories:null,
              views: totals.views!=null?totals.views:null,
              reach: totals.reach!=null?totals.reach:null,
              followerReach:null,
              profileVisits:null,
              saves: totals.saves!=null?totals.saves:(hasMediaAgg?weekSaves:null),
              shares: totals.shares!=null?totals.shares:(hasMediaAgg?weekShares:null),
              linkClicks: totals.profile_links_taps!=null?totals.profile_links_taps:null,
              storyViews:null,
              conversions:null
            };
            var weekly=getWeekly();
            var wi=weekly.findIndex(function(x){return x.weekStart===e.weekStart;});
            if(wi>=0){
              Object.keys(e).forEach(function(kk){ if(e[kk]!=null) weekly[wi][kk]=e[kk]; });
              weekly[wi].updatedAt=nowISO(); weekly[wi].source="api";
            } else {
              e.id=uid(); e.createdAt=nowISO(); e.updatedAt=nowISO(); e.source="api";
              weekly.push(e);
            }
            setWeekly(weekly);
            // 埋まった/欠けの一覧
            var labelMap={views:"ビュー数",reach:"リーチ",saves:"保存",shares:"シェア",linkClicks:"リンクタップ",newFollowers:"新規フォロワー",followersStart:"週初フォロワー",posts:"投稿数"};
            Object.keys(labelMap).forEach(function(kk){ if(e[kk]!=null) result.filled.push(labelMap[kk]); });
            [["stories","ストーリーズ本数"],["storyViews","ストーリーズ閲覧"],["followerReach","フォロワーリーチ"],["profileVisits","プロフィールアクセス"],["conversions","CV数"]]
              .forEach(function(pair){ if(e[pair[0]]==null) result.missing.push(pair[1]); });
            if(e.linkClicks==null) result.missing.push("外部リンククリック");
            onStep("完了", 100);
            return result;
          });
        });
      });
    });
  });
}

var routes=["dashboard","weekly","posts","diagnosis","kpis","settings"];
function parseHash(){
  var h=location.hash.replace(/^#\/?/,""), qi=h.indexOf("?"), path=h, qs="";
  if(qi>=0){ path=h.slice(0,qi); qs=h.slice(qi+1); }
  if(!path) path="dashboard";
  var params={}; qs.split("&").forEach(function(kv){ if(!kv)return; var p=kv.split("="); params[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||""); });
  return { path: routes.indexOf(path)>=0?path:"dashboard", params:params };
}
function navigate(path,params){
  var q="";
  if(params){ var a=[]; for(var k in params) a.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k])); if(a.length) q="?"+a.join("&"); }
  location.hash="#/"+path+q;
}

function toast(msg, actionLabel, actionFn){
  var old=document.querySelector(".toast"); if(old) old.remove();
  var t=document.createElement("div"); t.className="toast";
  t.innerHTML='<span>'+esc(msg)+'</span>'+(actionLabel?'<button type="button">'+esc(actionLabel)+'</button>':"");
  if(actionLabel){ t.querySelector("button").addEventListener("click",function(){ t.remove(); actionFn&&actionFn(); }); }
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode){ t.style.opacity="0"; t.style.transition="opacity .3s"; } }, actionLabel?5000:1800);
  setTimeout(function(){ t.remove(); }, actionLabel?5400:2200);
}

function viewDashboard(){
  var acc=currentAcct();
  var weekly=getWeekly();
  var settings=getSettings();
  var isApi=acc&&acc.mode==="api";

  // 今週入力済み？先週入力済み？
  var lastW=weekRange(1), lastKey=ymd(lastW.since);
  var hasLastWeek=weekly.some(function(e){return e.weekStart===lastKey;});
  var cta="";
  if(!hasLastWeek){
    cta='<div class="cta-hero mb"><div><h3>'+(isApi?"先週ぶんをワンタップで取り込めます":"先週ぶんの数値を入力しましょう")+'</h3>'+
      '<p>'+lastW.label+' のデータが未登録です。'+(isApi?"連携済みなので自動で入ります。":"5分で終わります。")+'</p></div>'+
      (isApi?'<button class="btn lg" data-act="open-import">'+IC.cloud+'先週ぶんを取り込む</button>'
            :'<button class="btn lg" data-act="w-new-go">'+IC.pen+'先週ぶんを入力する</button>')+'</div>';
  } else if(isApi){
    cta='<div class="flex" style="justify-content:flex-end;margin-bottom:14px"><button class="btn outline sm" data-act="open-import">'+IC.cloud+'データを取り込む</button></div>';
  }

  if(weekly.length===0){
    return pageHead("ダッシュボード", acc?("アカウント：「"+acc.name+"」"):"")+cta+
      '<div class="empty"><div class="eicon">'+IC.dash+'</div><h3>まだデータがありません</h3>'+
      '<p>'+(isApi?"「取り込む」を押すと先週の数値が自動で入ります。":"週次分析から数値を入力すると、KPIカード・トレンド・アラートが表示されます。")+'</p>'+
      '<div class="flex wrapf gap12 mt" style="justify-content:center">'+
      (isApi?'<button class="btn" data-act="open-import">'+IC.cloud+'先週ぶんを取り込む</button>':'<button class="btn" data-act="w-new-go">'+IC.pen+'週次分析で入力する</button>')+
      '<button class="btn outline" data-act="seed">'+IC.spark+'サンプルデータを入れる</button></div></div>';
  }

  var asc=weekly.slice().sort(function(a,b){return a.weekStart.localeCompare(b.weekStart);});
  var latest=asc[asc.length-1], prev=asc[asc.length-2];
  var lr=weeklyRates(latest), pr=prev?weeklyRates(prev):null;

  var cards=BENCH_META.map(function(m){
    var v=lr[m.key], pv=pr?pr[m.key]:null, th=settings.benchmarks[m.bk];
    var st=rateStatus(v,th.good,th.warn);
    return '<div class="kpi"><div class="lab"><span class="dot '+st+'"></span>'+m.label+'</div>'+
      '<div class="val tnum">'+pct(v)+'</div><div class="bm">'+deltaHtml(delta(v,pv))+' ・ 目安 '+m.bm+'</div></div>';
  }).join("");

  var alerts="";
  if(asc.length>=3){
    var l3=asc.slice(-3).map(weeklyRates);
    BENCH_META.forEach(function(m){
      var a=l3[0][m.key],b=l3[1][m.key],c=l3[2][m.key];
      if(a!=null&&b!=null&&c!=null&&a>b&&b>c){
        alerts+='<div class="alert"><div class="flex gap12 items-center"><div class="ai">'+IC.warn+'</div>'+
          '<div><div style="font-weight:600;font-size:14px">「'+m.label+'」が2週連続で低下しています</div>'+
          '<div class="muted fs12 tnum" style="margin-top:2px">'+[a,b,c].map(function(x){return pct(x);}).join(" → ")+'</div></div></div>'+
          (m.dk?'<button class="btn outline sm" data-act="go-diag" data-kpi="'+esc(m.dk)+'" data-state="'+esc(m.ds||"減った")+'">診断フローを見る'+IC.up+'</button>':"")+'</div>';
      }
    });
  }

  var last8=asc.slice(-8);
  var sparks=SPARK_KEYS.map(function(k,i){
    var series=last8.map(function(e){return {label:shortDate(e.weekStart),value:weeklyRates(e)[k]};});
    var meta=RATE_META.filter(function(m){return m.key===k;})[0];
    var lastv=series.length?series[series.length-1].value:null;
    var prevv=series.length>1?series[series.length-2].value:null;
    return '<div class="spark-wrap"><div class="flex between items-center" style="margin-bottom:6px"><span class="muted fs13">'+meta.label+'</span>'+deltaHtml(delta(lastv,prevv))+'</div>'+
      '<div class="tnum" style="font-size:20px;font-weight:700;margin-bottom:8px">'+pct(lastv)+'</div>'+sparkline(series,SPARK_COLORS[i])+'</div>';
  }).join("");

  return pageHead("ダッシュボード","最新週："+latest.weekStart+"（全"+weekly.length+"週）"+(latest.source==="api"?"・自動取得":""))+
    cta+
    (alerts?'<div class="stack mb">'+alerts+'</div>':"")+
    '<div class="grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px" id="kpi-grid">'+cards+'</div>'+
    '<div class="card mb"><div class="card-h"><h3>'+IC.spark+' 主要レートの推移 <span class="muted fs12" style="font-weight:400">直近'+last8.length+'週</span></h3></div>'+
    '<div class="card-p grid" style="grid-template-columns:repeat(2,1fr)">'+sparks+'</div></div>'+
    '<div class="card"><div class="card-h"><h3>ホーム率のトレンド</h3></div><div class="card-p">'+
    lineChart(last8.map(function(e){return {label:shortDate(e.weekStart),value:weeklyRates(e).homeRate};}), settings.benchmarks.homeRate.good, "目安 "+pct(settings.benchmarks.homeRate.good,0))+'</div></div>';
}

     '<button class="btn" data-act="w-new">'+IC.plus+'週を追加</button>');

      '<div class="stack" id="weekly-fields" style="gap:12px">'+

      secs+

      '<div class="grid" id="weekly-preview" style="grid-template-columns:repeat(2,1fr);gap:10px 16px"></div></div>'+
      '</div>'+
      '<div class="sticky-save"><button class="btn ghost" data-act="w-close">キャンセル</button>'+
      '<button class="btn lg" data-act="w-save">'+IC.save+(editing?"更新する":"保存する")+'</button></div>'+
      '</div></div>';

  var body="";
  if(weekly.length===0&&!weeklyFormOpen){
    body='<div class="empty"><div class="eicon">'+IC.cal+'</div><h3>週次データがありません</h3>'+
      '<p>'+(isApi?"「取り込む」で自動入力するか、「週を追加」で手入力できます。":"「週を追加」から最初の1週を入力してください。")+'</p>'+
      '<div class="flex gap8 wrapf mt" style="justify-content:center">'+
      (isApi?'<button class="btn" data-act="open-import">'+IC.cloud+'取り込む</button>':"")+
      '<button class="btn outline" data-act="w-new">'+IC.plus+'週を追加</button></div></div>';
  } else if(weekly.length>0){
    var mSel=RATE_META.map(function(m){return '<option value="'+m.key+'"'+(m.key===weeklyChartKey?" selected":"")+'>'+m.label+'</option>';}).join("");
    var cm=RATE_META.filter(function(m){return m.key===weeklyChartKey;})[0];
    var bench=cm.bk?settings.benchmarks[cm.bk].good:null;
    var series=asc.map(function(e){return {label:shortDate(e.weekStart),value:weeklyRates(e)[weeklyChartKey]};});
    var chart=asc.length>=2?lineChart(series,bench,bench!=null?"目安 "+pct(bench,0):"目安"):'<p class="muted fs13" style="text-align:center;padding:32px 0">2週以上のデータでグラフを表示します。</p>';
    var rows=desc.map(function(e){

        '<td class="r"><div class="flex gap8" style="justify-content:flex-end">'+
        '<button class="btn icon ghost" data-act="w-edit" data-ws="'+e.weekStart+'" aria-label="編集">'+IC.pen+'</button>'+
        '<button class="btn icon ghost" data-act="w-del" data-id="'+e.id+'" style="color:var(--bad)" aria-label="削除">'+IC.trash+'</button></div></td></tr>';

    body='<div class="card mb"><div class="card-h"><h3>レート推移</h3><select id="weekly-chart-key" style="width:auto;min-width:180px">'+mSel+'</select></div>'+

      '<th>週</th><th class="r">ホーム率</th><th class="r">保存率</th><th class="r">シェア率</th><th class="r">転換率</th><th class="r">プロフ率</th><th class="r">ストーリーズ</th><th class="r">CTR</th><th class="r">成約率</th><th class="r">操作</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';

  return head+form+body;
}

var POST_FORMATS=["リール","カルーセル","フィード単枚","ストーリーズ","ライブ"];
var POST_VERDICTS=["勝ち","普通","負け"];
var POST_NUM=[["views","ビュー数"],["reach","リーチ"],["nonFollowerReachPct","フォロワー外リーチ率（%）"],["videoSec","動画尺（秒）"],["avgWatchSec","平均視聴時間（秒）"],["likes","いいね"],["comments","コメント"],["saves","保存"],["shares","シェア"],["profileVisits","プロフィールアクセス"],["follows","フォロー数"]];
var postEditId=null, postFormOpen=false, postTab="list", postFmtFilter="all", postVerdictFilter="all", postSort={key:"date",dir:"desc"};

function readPostForm(){
  function val(id){ var el=document.getElementById(id); return el?el.value:""; }
  var p={ date:val("p-date"), format:val("p-format"), title:val("p-title"), hook:val("p-hook"), memo:val("p-memo"), verdict:val("p-verdict") };
  POST_NUM.forEach(function(f){ var s=val("p-"+f[0]).trim(); p[f[0]]=s===""?null:Number(s); });

}
function postPreview(){
  var p=readPostForm(), r=postRates(p), s=getSettings();

      '<h3 style="font-size:15px;font-weight:600;margin-bottom:14px">'+(editing?"投稿を編集":"投稿を追加")+(editing&&editing.igMediaId?' <span class="pill api">自動取得</span>':"")+'</h3>'+

      if(!wins.length){
        body=tabs+'<div class="empty"><div class="eicon">'+IC.trophy+'</div><h3>勝ち投稿がまだありません</h3><p>判定を「勝ち」にした投稿が、横展開用のネタ帳としてここに並びます。</p></div>';
      } else {

          return '<div class="card"><div class="card-p">'+
            '<div class="flex between items-center gap8"><span class="pill ok">勝ち</span><span class="muted fs12">'+esc(p.format)+"・"+shortDate(p.date)+'</span></div>'+
            '<div class="mt"><div style="font-weight:600">'+esc(p.title||"（無題）")+'</div>'+

            (p.memo?'<p class="fs13" style="background:color-mix(in srgb,var(--muted) 60%,var(--card));border-radius:10px;padding:12px;margin-top:10px">'+esc(p.memo)+'</p>':"")+

/* ============================ CSV / バックアップ ============================ */
function csvCell(v){ if(v==null) return ""; var s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function toCsv(rows){ return "﻿"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n"); }
function rp(v){ return v==null?"":(v*100).toFixed(2); }
function weeklyCsv(){
  var h=["週開始日","週初フォロワー数","新規フォロワー","投稿数","ストーリーズ本数","ビュー数","リーチ","フォロワーリーチ","プロフィールアクセス","保存","シェア","外部リンククリック","ストーリーズ閲覧","CV数","ホーム率%","保存率%","シェア率%","転換率%","プロフ率%","ストーリーズ閲覧率%","CTR%","成約率%"];
  var rows=getWeekly().slice().sort(function(a,b){return b.weekStart.localeCompare(a.weekStart);}).map(function(e){
    var r=weeklyRates(e);
    return [e.weekStart,e.followersStart,e.newFollowers,e.posts,e.stories,e.views,e.reach,e.followerReach,e.profileVisits,e.saves,e.shares,e.linkClicks,e.storyViews,e.conversions,rp(r.homeRate),rp(r.saveRate),rp(r.shareRate),rp(r.followerConversionRate),rp(r.profileVisitRate),rp(r.storyViewRate),rp(r.linkCtr),rp(r.conversionRate)];
  });
  return toCsv([h].concat(rows));
}
function postsCsv(){
  var h=["投稿日","形式","企画名","フック","判定","ビュー数","リーチ","いいね","コメント","保存","シェア","プロフィールアクセス","フォロー数","維持率%","いいね率%","保存率%","シェア率%","プロフ率%","学びメモ"];
  var rows=getPosts().slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(p){
    var r=postRates(p);
    return [p.date,p.format,p.title,p.hook,p.verdict,p.views,p.reach,p.likes,p.comments,p.saves,p.shares,p.profileVisits,p.follows,rp(r.retentionRate),rp(r.likeRate),rp(r.saveRate),rp(r.shareRate),rp(r.profileVisitRate),p.memo];
  });

}
function download(name,text,mime){
  var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function exportAll(){
  var accs=accounts(), data={};
  accs.forEach(function(a){
    data[a.id]={ weekly:load(dkOf(a.id,"weekly"),[]), posts:load(dkOf(a.id,"posts"),[]), checks:load(dkOf(a.id,"checks"),[]) };
  });
  return { app:"インスタ分析思考2026", version:2, exportedAt:nowISO(), accounts:accs, current:currentId(), settings:getSettings(), data:data };

function importAll(b){
  if(b.version===2 && Array.isArray(b.accounts)){
    saveAccounts(b.accounts);
    if(b.current) setCurrent(b.current);
    if(b.settings) save(K.settings,b.settings);
    Object.keys(b.data||{}).forEach(function(id){
      var d=b.data[id];
      if(d.weekly) save(dkOf(id,"weekly"),d.weekly);
      if(d.posts) save(dkOf(id,"posts"),d.posts);
      if(d.checks) save(dkOf(id,"checks"),d.checks);
    });
    return true;
  }
  // v1形式：現在のアカウント（なければ新規）に読み込み
  if(Array.isArray(b.weekly)||Array.isArray(b.posts)){
    if(!accounts().length) addAccount({name:"マイアカウント",mode:"manual"});
    if(Array.isArray(b.weekly)) setWeekly(b.weekly);
    if(Array.isArray(b.posts)) setPosts(b.posts);
    if(Array.isArray(b.checks)) setChecks(b.checks);
    if(b.settings) save(K.settings,b.settings);
    return true;
  }
  return false;
}

  else if(r.path==="kpis") html=viewKpis();
  else html=viewSettings();
  host.innerHTML=html;
  renderChrome();
  if(r.path==="weekly"&&weeklyFormOpen){ weeklyPreview(); var wf=document.getElementById("weekly-fields"); if(wf) wf.addEventListener("input",weeklyPreview); }
  if(r.path==="posts"&&postFormOpen){ postPreview(); POST_NUM.forEach(function(f){ var el=document.getElementById("p-"+f[0]); if(el) el.addEventListener("input",postPreview); }); }
}

/* ============================ イベント ============================ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var act=t.getAttribute("data-act");

  if(act==="theme"){ toggleTheme(); return; }

  /* ウィザード */
  if(act==="wiz-api"){ openConnectModal(true); return; }
  if(act==="wiz-manual"){ openManualAddModal(); return; }
  if(act==="wiz-sample"){
    addAccount({name:"サンプル",mode:"manual"});
    seedInto(); render(); toast("サンプルデータを入れました。自由に触ってみてください");
    return;
  }

  /* アカウント */
  if(act==="switch-acct"){ setCurrent(t.getAttribute("data-id")); weeklyFormOpen=false; postFormOpen=false; editWeekStart=null; postEditId=null; render(); return; }
  if(act==="add-acct"){
    // 選択肢：連携 or 手動
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal"><h3>アカウントを追加</h3><div class="stack mt">'+
      '<button class="big-choice" data-w="api" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px;cursor:pointer"><span style="width:40px;height:40px;border-radius:12px;background:var(--accent-bg);color:var(--primary);display:grid;place-items:center;flex:none">'+IC.link+'</span><span><b>Instagram連携で追加</b><p class="muted fs12" style="margin-top:2px">数値を自動で取り込めます</p></span></button>'+
      '<button class="big-choice" data-w="manual" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px;cursor:pointer"><span style="width:40px;height:40px;border-radius:12px;background:var(--muted);color:var(--muted-ink);display:grid;place-items:center;flex:none">'+IC.keyb+'</span><span><b>手動アカウントを追加</b><p class="muted fs12" style="margin-top:2px">連携できないアカウントはこちら</p></span></button>'+
      '</div><div class="modal-foot"><button class="btn ghost" data-w="x">閉じる</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click",function(ev){
      var b=ev.target.closest("[data-w]");
      if(ev.target===bg){ bg.remove(); return; }
      if(!b) return;
      var w=b.getAttribute("data-w"); bg.remove();
      if(w==="api") openConnectModal(false);
      else if(w==="manual") openManualAddModal();
    });
    return;
  }
  if(act==="acct-del"){
    var aid=t.getAttribute("data-id");
    var a=accounts().filter(function(x){return x.id===aid;})[0];
    confirmModal("「"+(a?a.name:"")+"」を削除しますか？","このアカウントの週次・投稿・チェックの記録もすべて消えます。元に戻せません。","削除する",function(){
      saveAccounts(accounts().filter(function(x){return x.id!==aid;}));
      del(dkOf(aid,"weekly")); del(dkOf(aid,"posts")); del(dkOf(aid,"checks"));
      if(currentId()===null||load(K.current,null)===aid){ var rest=accounts(); if(rest.length) setCurrent(rest[0].id); else del(K.current); }
      render(); toast("削除しました");
    });
    return;
  }
  if(act==="open-connect"){ openConnectModal(false); return; }
  if(act==="add-manual"){ openManualAddModal(); return; }
  if(act==="open-import"){ openImportModal(); return; }

  if(act==="seed"){ seedInto(); render(); toast("サンプルデータを入れました"); return; }
  if(act==="go-diag"){ diagKpi=null; diagState=null; navigate("diagnosis",{kpi:t.getAttribute("data-kpi"),state:t.getAttribute("data-state")||"減った"}); return; }
  if(act==="w-new-go"){ weeklyFormOpen=true; editWeekStart=null; navigate("weekly"); render(); return; }

  /* 週次 */
  if(act==="w-new"){ editWeekStart=null; weeklyFormOpen=true; render(); return; }
  if(act==="w-close"){ weeklyFormOpen=false; editWeekStart=null; render(); return; }
  if(act==="w-edit"){ editWeekStart=t.getAttribute("data-ws"); weeklyFormOpen=true; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act==="w-del"){
    var wid=t.getAttribute("data-id");
    var weekly=getWeekly(); var item=weekly.filter(function(x){return x.id===wid;})[0];
    confirmModal("この週のデータを削除しますか？","","削除する",function(){
      setWeekly(getWeekly().filter(function(x){return x.id!==wid;}));
      lastDeleted={kind:"weekly",item:item};
      render();
      toast("削除しました","元に戻す",function(){
        if(lastDeleted&&lastDeleted.kind==="weekly"){ var w2=getWeekly(); w2.push(lastDeleted.item); setWeekly(w2); lastDeleted=null; render(); }
      });
    });
    return;
  }
  if(act==="w-save"){
    var e2=readWeeklyForm();
    if(!e2.weekStart&&editWeekStart) e2.weekStart=editWeekStart;
    if(!e2.weekStart){ toast("週開始日を入力してください"); return; }
    var list2=getWeekly();
    var idx2=list2.findIndex(function(x){return x.weekStart===e2.weekStart;});
    var wasEdit=!!editWeekStart;
    if(idx2>=0){
      Object.keys(e2).forEach(function(kk){ list2[idx2][kk]=e2[kk]; });
      list2[idx2].updatedAt=nowISO();
    } else {
      e2.id=uid(); e2.createdAt=nowISO(); e2.updatedAt=nowISO();
      list2.push(e2);
    }
    setWeekly(list2); weeklyFormOpen=false; editWeekStart=null; render(); toast(wasEdit?"更新しました":"保存しました");
    return;
  }

  /* 投稿 */
  if(act==="p-new"){ postEditId=null; postFormOpen=true; postTab="list"; render(); return; }
  if(act==="p-close"){ postFormOpen=false; postEditId=null; render(); return; }
  if(act==="p-edit"){ postEditId=t.getAttribute("data-id"); postFormOpen=true; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act==="p-del"){
    var pid=t.getAttribute("data-id");
    var posts=getPosts(); var pitem=posts.filter(function(x){return x.id===pid;})[0];
    confirmModal("この投稿を削除しますか？","","削除する",function(){
      setPosts(getPosts().filter(function(x){return x.id!==pid;}));
      lastDeleted={kind:"post",item:pitem};
      render();
      toast("削除しました","元に戻す",function(){
        if(lastDeleted&&lastDeleted.kind==="post"){ var p2=getPosts(); p2.push(lastDeleted.item); setPosts(p2); lastDeleted=null; render(); }
      });
    });
    return;
  }
  if(act==="p-tab"){ postTab=t.getAttribute("data-tab"); render(); return; }
  if(act==="p-sort"){ var k2=t.getAttribute("data-key"); if(postSort.key===k2){ postSort.dir=postSort.dir==="asc"?"desc":"asc"; } else { postSort.key=k2; postSort.dir="desc"; } render(); return; }
  if(act==="p-save"){
    var p3=readPostForm(); if(!p3.date){ toast("投稿日を入力してください"); return; }
    var plist=getPosts();
    if(postEditId){
      var pi=plist.findIndex(function(x){return x.id===postEditId;});
      if(pi>=0){ var keep=plist[pi]; Object.keys(p3).forEach(function(kk){ keep[kk]=p3[kk]; }); keep.updatedAt=nowISO(); }
      toast("更新しました");
    } else {
      p3.id=uid(); p3.createdAt=nowISO(); p3.updatedAt=nowISO(); plist.push(p3);
      toast("保存しました");
    }
    setPosts(plist); postFormOpen=false; postEditId=null; render();
    return;
  }

  /* 診断 */
  if(act==="d-kpi"){ diagKpi=t.getAttribute("data-kpi"); diagState=null; render(); return; }
  if(act==="d-state"){ diagState=t.getAttribute("data-state"); render(); return; }
  if(act==="d-reset"){ diagKpi=null; diagState=null; render(); return; }
  if(act==="d-check"){
    var did=+t.getAttribute("data-id"); var checks=getChecks();
    if(checks.some(function(c){return c.diagnosisId===did;})) checks=checks.filter(function(c){return c.diagnosisId!==did;});
    else checks.push({diagnosisId:did,checkedAt:nowISO()});
    setChecks(checks); render(); return;
  }

  if(act==="k-tab"){ kpiTab=t.getAttribute("data-tab"); render(); return; }

  /* 設定 */
  if(act==="s-save"){
    var s=getSettings();
    document.querySelectorAll("[data-bench]").forEach(function(el){ var b=el.getAttribute("data-bench"),f=el.getAttribute("data-field"); var n=Number(el.value); s.benchmarks[b][f]=isFinite(n)?n/100:0; });
    document.querySelectorAll("[data-verdict]").forEach(function(el){ var v=el.getAttribute("data-verdict"); var n=Number(el.value); s.verdict[v]=isFinite(n)?n/100:0; });
    save(K.settings,s); toast("設定を保存しました");
    return;
  }
  if(act==="s-reset"){ save(K.settings,JSON.parse(JSON.stringify(DEFAULT_SETTINGS))); render(); toast("初期値に戻しました"); return; }
  if(act==="ex-json"){ download("insta-analytics-"+todayYmd()+".json", JSON.stringify(exportAll(),null,2), "application/json"); return; }
  if(act==="im-json"){ document.getElementById("file-input").click(); return; }
  if(act==="ex-weekly"){ download("weekly-"+todayYmd()+".csv", weeklyCsv(), "text/csv;charset=utf-8"); return; }
  if(act==="ex-posts"){ download("posts-"+todayYmd()+".csv", postsCsv(), "text/csv;charset=utf-8"); return; }
  if(act==="clear-all"){
    confirmModal("すべてのデータを削除しますか？","全アカウントの週次・投稿・チェック・連携設定が消えます。元に戻せません。先にJSON書き出しをおすすめします。","すべて削除する",function(){
      accounts().forEach(function(a){ del(dkOf(a.id,"weekly")); del(dkOf(a.id,"posts")); del(dkOf(a.id,"checks")); });
      del(K.accounts); del(K.current); del(K.api); save(K.settings,JSON.parse(JSON.stringify(DEFAULT_SETTINGS)));
      render(); toast("全データを削除しました");
    });
    return;
  }
});

document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="weekly-chart-key"){ weeklyChartKey=el.value; render(); return; }
  if(el.id==="p-fmt-filter"){ postFmtFilter=el.value; render(); return; }
  if(el.id==="p-verdict-filter"){ postVerdictFilter=el.value; render(); return; }
  if(el.id==="file-input"){
    var file=el.files&&el.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var ok=importAll(JSON.parse(String(reader.result)));
        render(); toast(ok?"データを読み込みました":"対応していない形式です");
      }catch(err){ toast("読み込みに失敗しました（JSON形式を確認）"); }
    };
    reader.readAsText(file); el.value="";
  }
});

window.addEventListener("hashchange",function(){ weeklyFormOpen=false; postFormOpen=false; editWeekStart=null; postEditId=null; render(); });

/* ============================ 起動 ============================ */

  var stored=load(K.theme,null);
  if(stored) document.documentElement.setAttribute("data-theme",stored);
  migrate();
  document.getElementById("root").innerHTML=
    '<div class="app">'+
    '<aside class="side"><div class="brand"><div class="logo">イ</div><div><div style="font-size:14px;font-weight:600">インスタ分析思考</div><small class="tnum">2026</small></div></div>'+
    '<nav class="nav" id="side-nav"></nav>'+
    '<div class="side-foot"><span>データはこの端末内のみ</span><button class="btn icon ghost" id="theme-btn" data-act="theme" aria-label="テーマ切替"></button></div></aside>'+
    '<div style="min-width:0;display:flex;flex-direction:column">'+
    '<header class="topbar"><div class="brand" style="padding:0"><div class="logo" style="width:32px;height:32px">イ</div><div><div style="font-size:14px;font-weight:600">インスタ分析思考 2026</div></div></div>'+
    '<button class="btn icon ghost" id="theme-btn-m" data-act="theme" aria-label="テーマ切替"></button></header>'+
    '<main><div class="wrap"><div id="acct-host"></div><div id="view"></div></div></main></div>'+
    '<nav class="btabs" id="btabs"></nav></div>'+
    '<input type="file" id="file-input" accept="application/json,.json" style="display:none">';
  render();
})();

})();
